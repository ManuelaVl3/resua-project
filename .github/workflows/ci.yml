name: CI — RESUA Pruebas Unitarias

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ─────────────────────────────────────────────
  # Job 1: auth-ms (Java + Spring Security + JWT)
  # Requisitos: 1 (registro), 2 (login), 10 (JWT)
  # ─────────────────────────────────────────────
  auth-ms:
    name: auth-ms — Pruebas unitarias
    runs-on: ubuntu-latest

    services:
      auth-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Ejecutar pruebas unitarias
        working-directory: auth-ms
        run: |
          ./mvnw test \
            -Dtest="JwtServiceTest,LoginUserImplTest,CreateUserImplTest,VerifySecretAnswerImplTest,ResetPasswordImplTest,UpdateUserImplTest,GetUserByIdImplTest,GetUserByEmailImplTest,UserDetailsServiceImplTest" \
            --no-transfer-progress

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-ms-surefire-reports
          path: auth-ms/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: observations-ms (Java)
  # Requisitos: 3 (creación), 4 (imágenes), 6 (visualización),
  #             8 (edición), 9 (eliminación), 11 (rendimiento), 12 (persistencia)
  # ─────────────────────────────────────────────────────────────────────────
  observations-ms:
    name: observations-ms — Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Ejecutar pruebas unitarias
        working-directory: observations-ms
        run: |
          ./mvnw test \
            -Dtest="CreateObservationImplTest,LocalStorageServiceTest,GetObservationByIdImplTest,GetObservationByUserImplTest,UpdateObservationImplTest,DeleteObservationByIdImplTest,RegisterAdapterTest,GetObservationByUserPerformanceTest" \
            --no-transfer-progress

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observations-ms-surefire-reports
          path: observations-ms/target/surefire-reports/

  # ──────────────────────────────────────────────────────────
  # Job 3: agent-ms (Python + pytest)
  # Requisito: 5 (sugerencia de especie mediante IA — mock)
  # ──────────────────────────────────────────────────────────
  agent-ms:
    name: agent-ms — Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        working-directory: agent-ms
        run: pip install -r requirements.txt pytest

      - name: Ejecutar pruebas
        working-directory: agent-ms
        env:
          GEMINI_API_KEY: test-api-key-for-unit-tests
        run: python -m pytest tests/test_gemini_service.py -v

  # ──────────────────────────────────────────────────────────
  # Job 4: resua-frontend (Node.js)
  # Requisitos: 7 (filtros de búsqueda), 13 (usabilidad / paginación)
  # ──────────────────────────────────────────────────────────
  resua-frontend:
    name: resua-frontend — Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ejecutar pruebas
        working-directory: resua-frontend
        run: node --test tests/searchPagination.test.mjs
