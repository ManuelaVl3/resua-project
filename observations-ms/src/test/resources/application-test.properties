# Perfil de prueba: sin PostgreSQL ni variables de entorno externas.
# La creación de esquema la hace Hibernate (create-drop) solo en tests.

spring.datasource.url=jdbc:h2:mem:observations_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Valores fijos (no se llama a la API de AWS al arrancar el contexto; solo se construye S3Client)
aws.access-key-id=test-access-key-id
aws.secret-access-key=test-secret-access-key
aws.region=us-east-2
aws.s3.bucket-name=test-bucket
